# IDF images to test against. Add or remove tags here to update every board group.
.idf_image_matrix: &idf_image_matrix
  - "espressif/idf:v5.4.4"
  - "espressif/idf:v5.5.5"
  - "espressif/idf:v6.0.3"
  - "espressif/idf:v6.1"
  - "espressif/idf:latest"

# ESP32-S31 is available from IDF v6.1 onward.
.idf_s31_image_matrix: &idf_s31_image_matrix
  - "espressif/idf:v6.1"
  - "espressif/idf:latest"

# Product boards keep real-board compile coverage. Synthetic boards under
# esp_board_manager/test_apps/components/ci_coverage_boards/ stack every
# SoC-supported peripheral wrapper plus compile-cheap device wrappers (LCD/touch
# use local fake factories). They are not hardware bring-up configs.
# test_ethernet_extra covers custom PHY discovery, dependencies, and C adapters.
build_test_apps:
  extends:
    - .rules:build
    - .build_template
  parallel:
    matrix:
      - IDF_IMAGE: *idf_image_matrix
        BOARD: ["esp32_coverage", "test_ethernet_extra"]
        IDF_TARGET: ["esp32"]
      - IDF_IMAGE: *idf_image_matrix
        BOARD: ["esp32s3_coverage", "esp32_s3_korvo_2_3"]
        IDF_TARGET: ["esp32s3"]
      - IDF_IMAGE: *idf_image_matrix
        BOARD: ["esp32c3_coverage"]
        IDF_TARGET: ["esp32c3"]
      - IDF_IMAGE: *idf_image_matrix
        BOARD: ["esp32p4_coverage", "esp32_p4_function_ev_board"]
        IDF_TARGET: ["esp32p4"]
      - IDF_IMAGE: *idf_s31_image_matrix
        BOARD: ["esp32s31_coverage", "esp32_s31_korvo_1"]
        IDF_TARGET: ["esp32s31"]
  script:
    - idf.py --version
    - python -c "from importlib.metadata import version; print('esp-bmgr-assist', version('esp-bmgr-assist'))"
    - cd esp_board_manager/test_apps
    - mkdir -p "logs/${BOARD}"
    - idf.py bmgr -b "${BOARD}" 2>&1 | tee "logs/${BOARD}/bmgr.log"
    - SDKCONFIG_DEFAULTS="sdkconfig.defaults;components/gen_bmgr_codes/board_manager.defaults" idf-build-apps build --paths . --target "${IDF_TARGET}" --parallel-count 1 --parallel-index 1

trigger_gmf_regression:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
  inherit:
    variables: false
  variables:
    UPSTREAM_COMPONENT: "auto"
    UPSTREAM_PROJECT_PATH: "$CI_PROJECT_PATH"
    UPSTREAM_SHA: "$CI_COMMIT_SHA"
    UPSTREAM_BASE_SHA: "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
  trigger:
    project: adf/multimedia/esp-gmf
    branch: main
    strategy: depend

trigger_adf_regression:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
  inherit:
    variables: false
  variables:
    UPSTREAM_COMPONENT: "auto"
    UPSTREAM_PROJECT_PATH: "$CI_PROJECT_PATH"
    UPSTREAM_SHA: "$CI_COMMIT_SHA"
    UPSTREAM_BASE_SHA: "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
  trigger:
    project: adf/esp-adf-internal
    branch: master
    strategy: depend
