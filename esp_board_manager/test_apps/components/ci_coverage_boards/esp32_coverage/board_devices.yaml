devices:
- name: lcd_power
  type: gpio_ctrl
  version: 1.0.0
  config:
    active_level: 1
    default_level: 0
  peripherals:
  - gpio_name: gpio_power
- name: gpio_button_0
  type: button
  sub_type: gpio
  config:
    active_level: 0
  peripherals:
  - gpio_name: gpio_button
- name: adc_button_0
  type: button
  sub_type: adc_single
  config:
    button_index: 0
    min_voltage: 0
    max_voltage: 500
  peripherals:
  - adc_name: adc_oneshot
- name: adc_button_group
  type: button
  sub_type: adc_multi
  config:
    button_num: 2
    voltage_range:
    - 380
    - 820
    max_voltage: 3000
  peripherals:
  - adc_name: adc_oneshot
- name: lcd_brightness
  type: ledc_ctrl
  version: 1.0.0
  config:
    default_percent: 50
  peripherals:
  - ledc_name: ledc_backlight
- name: audio_power
  type: power_ctrl
  sub_type: gpio
  peripherals:
  - gpio_name: gpio_pa_control
    active_level: 1
- name: fs_spiffs
  type: fs_spiffs
  version: 1.0.0
  config:
    base_path: /spiffs
    partition_label: storage
    max_files: 5
    format_if_mount_failed: false
- name: littlefs
  type: littlefs
  sub_type: flash
  version: default
  config:
    vfs_config:
      base_path: /littlefs
      partition_label: littlefs
      format_if_mount_failed: false
- name: coverage_custom
  type: custom
  version: 1.0.0
  config:
    placeholder: 1
- name: display_lcd_spi
  type: display_lcd
  chip: fake_lcd
  sub_type: spi
  version: 1.0.0
  config:
    x_max: 320
    y_max: 240
    frame_format: RGB565_BE
    io_spi_config:
      cs_gpio_num: -1
      dc_gpio_num: -1
      pclk_hz: 40000000
      trans_queue_depth: 1
    lcd_panel_config:
      reset_gpio_num: -1
      bits_per_pixel: 16
  peripherals:
  - spi_name: spi_master
- name: lcd_touch
  chip: fake_touch
  type: lcd_touch
  sub_type: i2c
  version: 1.0.0
  config:
    io_i2c_config:
      control_phase_bytes: 1
      dc_bit_offset: 0
      lcd_cmd_bits: 8
      lcd_param_bits: 0
      scl_speed_hz: 100000
      flags:
        disable_control_phase: true
    touch_config:
      x_max: 320
      y_max: 240
      rst_gpio_num: -1
      int_gpio_num: -1
  peripherals:
  - i2c_name: i2c_master
    i2c_addr:
    - 186
- name: gpio_expander
  chip: fake_expander
  type: gpio_expander
  config:
    max_pins: 8
    output_io_mask:
    - 1
    - 2
    output_io_level_mask:
    - 1
    - 0
  peripherals:
  - i2c_name: i2c_master
    i2c_addr:
    - 112
- name: fs_fat_spi
  type: fs_fat
  version: default
  sub_type: spi
  config:
    mount_point: /sdcard
    vfs_config:
      format_if_mount_failed: false
      max_files: 5
      allocation_unit_size: 16384
    sub_config:
      cs_gpio_num: -1
  peripherals:
  - spi_name: spi_master
- name: fs_fat_sdmmc
  type: fs_fat
  version: 1.0.0
  sub_type: sdmmc
  config:
    mount_point: /sdmmc
    vfs_config:
      format_if_mount_failed: false
      max_files: 5
      allocation_unit_size: 16384
    sub_config:
      slot: SDMMC_HOST_SLOT_1
      frequency: SDMMC_FREQ_DEFAULT
      bus_width: 1
      pins:
        clk: -1
        cmd: -1
        d0: -1
        d1: -1
        d2: -1
        d3: -1
        d4: -1
        d5: -1
        d6: -1
        d7: -1
        cd: -1
        wp: -1
      ldo_chan_id: -1
- name: littlefs_spi
  type: littlefs
  sub_type: spi
  version: default
  config:
    vfs_config:
      base_path: /littlefs_spi
      format_if_mount_failed: false
    sub_config:
      cs_gpio_num: -1
      frequency: SDMMC_FREQ_DEFAULT
  peripherals:
  - spi_name: spi_master
- name: littlefs_sdmmc
  type: littlefs
  sub_type: sdmmc
  version: default
  config:
    vfs_config:
      base_path: /littlefs_sdmmc
      format_if_mount_failed: false
    sub_config:
      slot: SDMMC_HOST_SLOT_1
      frequency: SDMMC_FREQ_DEFAULT
      bus_width: 1
      pins:
        clk: -1
        cmd: -1
        d0: -1
        d1: -1
        d2: -1
        d3: -1
        d4: -1
        d5: -1
        d6: -1
        d7: -1
        cd: -1
        wp: -1
      ldo_chan_id: -1
- name: led_strip
  type: led_strip
  chip: ws2812
  sub_type: rmt
  version: 1.0.0
  config:
    strip_gpio_num: 2
    max_leds: 1
    led_model: LED_MODEL_WS2812
    color_component_format: LED_STRIP_COLOR_COMPONENT_FMT_GRB
    rmt:
      clk_src: RMT_CLK_SRC_DEFAULT
- name: audio_dac
  chip: es8311
  type: audio_codec
  config:
    adc_enabled: false
    dac_enabled: true
    sys_cfg:
      no_mclk: true
  peripherals:
  - pa_name: gpio_pa_control
    gain: 6
    active_level: 1
  - i2s_name: i2s_audio_out
  - i2c_name: i2c_master
    address: 48
    frequency: 100000
- name: knob
  type: knob
  sub_type: gpio
  config:
    gpio_encoder_a: 1
    gpio_encoder_b: 0
    default_direction: 0
