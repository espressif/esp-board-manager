# Devices Configuration for Candis-S31
devices:
  - name: pmic
    chip: tg28_sw
    type: custom
    version: 1.0.0
    dependencies:
      espressif/tg28_sw: "^0.3.0"
    config:
      i2c_address: 0x34
      frequency_hz: 400000
    peripherals:
      - name: i2c_low_power
      - name: gpio_pmic_rtc_interrupt

  - name: rtc
    chip: rx8130ce
    type: custom
    version: 1.0.0
    dependencies:
      espressif/rx8130ce: "^0.3.0"
    config:
      i2c_address: 0x32
      frequency_hz: 400000
    peripherals:
      - name: i2c_low_power
      - name: gpio_pmic_rtc_interrupt

  - name: type_c_controller
    chip: fusb303b
    type: custom
    version: 1.0.0
    dependencies:
      espressif/fusb303b: "^0.2.0"
    config:
      i2c_addresses: [0x21, 0x31]
      frequency_hz: 400000
      enable_active_level: 0
    peripherals:
      - name: i2c_main
      - name: gpio_type_c_enable
      - name: gpio_type_c_interrupt

  - name: board_power_ctrl
    type: power_ctrl
    sub_type: custom
    depends_on: pmic
    config:
      camera_reset_gpio: 39
      camera_pwdn_gpio: 40
    peripherals:
      - name: gpio_display_vbat
      - name: gpio_display_vci
      - name: gpio_sd_power
      - name: gpio_pa_control

  - name: usb_otg_power
    type: gpio_ctrl
    version: default
    config:
      active_level: 1
      default_level: 0
    peripherals:
      - name: gpio_usb_otg_enable

  - name: led_strip
    chip: ws2812
    type: led_strip
    sub_type: rmt
    version: 1.0.0
    power_ctrl_device: board_power_ctrl
    config:
      strip_gpio_num: 4
      max_leds: 1
      led_model: LED_MODEL_WS2812
      color_component_format: LED_STRIP_COLOR_COMPONENT_FMT_GRB
      invert_out: false
      rmt:
        clk_src: RMT_CLK_SRC_DEFAULT
        resolution_hz: 10000000
        mem_block_symbols: 0
        with_dma: false

  - name: audio_dac
    chip: es8389
    type: audio_codec
    version: default
    power_ctrl_device: board_power_ctrl
    config:
      adc_enabled: false
      dac_enabled: true
      dac_max_channel: 2
      dac_channel_mask: "11"
      dac_init_gain: 0
      mclk_enabled: true
    peripherals:
      - name: gpio_pa_control
        gain: 6
        active_level: 1
      - name: i2s_audio_out
      - name: i2c_main
        address: 0x20
        frequency: 400000

  - name: audio_adc
    chip: es8389
    type: audio_codec
    version: default
    power_ctrl_device: board_power_ctrl
    config:
      adc_enabled: true
      dac_enabled: false
      adc_max_channel: 2
      adc_channel_mask: "11"
      adc_channel_labels: [FR, FL]
      adc_init_gain: 0
      mclk_enabled: true
    peripherals:
      - name: i2s_audio_in
      - name: i2c_main
        address: 0x20
        frequency: 400000

  - name: fs_sdcard
    type: fs_fat
    sub_type: sdmmc
    power_ctrl_device: board_power_ctrl
    version: default
    config:
      mount_point: "/sdcard"
      vfs_config:
        format_if_mount_failed: false
        max_files: 5
        allocation_unit_size: 16384
      sub_config:
        slot: SDMMC_HOST_SLOT_0
        frequency: SDMMC_FREQ_HIGHSPEED
        bus_width: 4
        slot_flags: SDMMC_SLOT_FLAG_INTERNAL_PULLUP
        pins:
          clk: 24
          cmd: 25
          d0: 20
          d1: 21
          d2: 22
          d3: 23
          cd: 0
          wp: -1

  - name: display_lcd
    chip: co5300
    type: display_lcd
    sub_type: spi
    power_ctrl_device: board_power_ctrl
    version: default
    dependencies:
      espressif/esp_lcd_co5300: "^2.0.3"
    config:
      swap_xy: false
      mirror_x: false
      mirror_y: false
      x_max: 460
      y_max: 460
      invert_color: false
      need_reset: true
      io_spi_config:
        cs_gpio_num: 10
        dc_gpio_num: -1
        spi_mode: 0
        pclk_hz: 40000000
        trans_queue_depth: 10
        lcd_cmd_bits: 32
        lcd_param_bits: 8
        flags:
          quad_mode: true
      lcd_panel_config:
        reset_gpio_num: 15
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
        data_endian: LCD_RGB_DATA_ENDIAN_BIG
        bits_per_pixel: 16
        flags:
          reset_active_high: false
    peripherals:
      - name: spi_display

  - name: lcd_touch
    chip: cst820
    type: lcd_touch
    sub_type: i2c
    power_ctrl_device: board_power_ctrl
    version: default
    dependencies:
      # "espressif/esp_lcd_touch_cst820" does not exist in the public
      # component registry (only a kodediy fork is published there), but the
      # dependency name must stay unchanged: the project-level
      # idf_component.yml override_path targets this exact name and points at
      # the locally maintained driver in
      # esp-bsp/components/lcd_touch/esp_lcd_touch_cst820. The kodediy
      # version is unusable with this module: it is incompatible with the
      # panel's 15-byte touch report format.
      espressif/esp_lcd_touch_cst820: "^1.0.0"
    config:
      io_i2c_config:
        lcd_cmd_bits: 8
        scl_speed_hz: 400000
      touch_config:
        x_max: 460
        y_max: 460
        rst_gpio_num: 17
        int_gpio_num: 3
        levels:
          reset: 0
          interrupt: 0
        flags:
          swap_xy: false
          mirror_x: false
          mirror_y: false
    peripherals:
      - name: i2c_main
        i2c_addr: [0x2A]  # Board Manager uses the 8-bit form of 7-bit address 0x15.

  - name: camera
    type: camera
    sub_type: dvp
    power_ctrl_device: board_power_ctrl
    version: default
    config:
      dvp_config:
        reset_io: 39
        pwdn_io: 40
        vsync_io: 56
        data_width: CAM_CTLR_DATA_WIDTH_8
        de_io: 57
        pclk_io: 54
        xclk_io: 55
        # XCLK is 24 MHz (measured baseline): the OV5640 register tables are
        # calculated for a 24 MHz input, so keep this in sync with
        # BSP_CAMERA_XCLK_CLOCK_MHZ in bsp/candis_s31.h. With sub_type dvp
        # the ESP32-S31 DVP camera controller derives XCLK itself from
        # PLL_F160M and routes it to xclk_io through the GPIO output matrix,
        # therefore no LEDC channel is configured on this BM path. (The BSP
        # additionally starts a redundant LEDC XCLK on the same pin for
        # compatibility, but the GPIO matrix lets the cam controller's later
        # write win. Do not reintroduce an LEDC channel in this YAML.)
        xclk_freq: 24000000
        data_io:
          data_io_0: 46
          data_io_1: 47
          data_io_2: 48
          data_io_3: 49
          data_io_4: 50
          data_io_5: 51
          data_io_6: 52
          data_io_7: 53
    peripherals:
      - name: i2c_main
        frequency: 100000
