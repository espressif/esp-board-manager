# Devices Configuration for ESP32-C3-DevKit-RUST-2
#
# Source: ESP32-C3-DevKit-RUST-2 SCHEMATIC, rev 2.0, dated 2025-10-28
# Reference: https://dl.espressif.com/public/esp32-c3-devkit-rust-2-schematic.pdf
# Reference: https://docs.espressif.com/projects/esp-dev-kits/en/latest/esp32c3/esp32-c3-devkit-rust-2/user_guide.html
#
# The user guide's pin tables are stale in three places — see the header of
# board_peripherals.yaml before changing any pin here.
#
devices:
  # ---------- On-board WS2812 addressable RGB LED (GPIO2) ----------
  - name: led_strip
    chip: ws2812
    type: led_strip
    sub_type: rmt
    version: 1.0.0
    config:
      strip_gpio_num: 2
      max_leds: 1
      led_model: LED_MODEL_WS2812
      color_component_format: LED_STRIP_COLOR_COMPONENT_FMT_GRB
      invert_out: false
      rmt:
        clk_src: RMT_CLK_SRC_DEFAULT
        resolution_hz: 10000000
        mem_block_symbols: 0
        with_dma: false

  # ---------- User LED (GPIO10, active-high) ----------
  # Schematic: IO10 -> R10 470R 1% -> D2 anode; D2 cathode -> GND, so the
  # GPIO sources current and 1 lights it. Moved here from GPIO7 in RUST-1
  # (user guide revision list: "Changed the GPIO for the user LED from GPIO7
  # to GPIO10"); GPIO10 was RUST-1's I2C SDA, which is now GPIO7.
  - name: user_led
    type: gpio_ctrl
    version: default
    config:
      active_level: 1
      default_level: 0
    peripherals:
      - gpio_name: gpio_user_led

  # ---------- BOOT button (GPIO9, active-low, strapping) ----------
  - name: boot_button
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      enable_power_save: false
      disable_pull: false
      long_press_time: 2000
      short_press_time: 100
    peripherals:
      - gpio_name: gpio_boot_button
