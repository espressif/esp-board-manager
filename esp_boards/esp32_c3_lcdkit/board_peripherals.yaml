peripherals:
  - name: spi_display
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI2_HOST
        mosi_io_num: 0
        miso_io_num: -1
        sclk_io_num: 1
        quadwp_io_num: -1
        quadhd_io_num: -1
        max_transfer_sz: 38400

  - name: i2s_audio_out
    type: i2s
    role: master
    format: pdm-out
    config:
      port: 0
      sample_rate_hz: 22050
      data_bit_width: 16
      slot_mode: I2S_SLOT_MODE_MONO
      pins:
        mclk: -1
        bclk: -1
        ws: -1
        dout: 3
        din: -1

  - name: ledc_backlight
    type: ledc
    config:
      gpio_num: 5
      speed_mode: LEDC_LOW_SPEED_MODE
      channel: LEDC_CHANNEL_0
      timer_sel: LEDC_TIMER_0
      freq_hz: 5000
      duty: 0
      duty_resolution: LEDC_TIMER_10_BIT

  # Knob encoder press (GPIO9). Schematic net: BOOT Button IO9 — same pad.
  - name: gpio_encoder_press
    type: gpio
    role: io
    config:
      pin: 9
      mode: GPIO_MODE_INPUT
      pull_up: true
      pull_down: false
      intr_type: GPIO_INTR_DISABLE
