devices:
  - name: display_lcd
    chip: gc9a01
    type: display_lcd
    sub_type: spi
    version: default
    dependencies:
      espressif/esp_lcd_gc9a01: "*"
    config:
      mirror_x: true
      mirror_y: false
      invert_color: true
      x_max: 240
      y_max: 240
      io_spi_config:
        cs_gpio_num: 7
        dc_gpio_num: 2
        pclk_hz: 80000000
        spi_mode: 0
      lcd_panel_config:
        reset_gpio_num: -1
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_BGR
        bits_per_pixel: 16
    peripherals:
      - spi_name: spi_display

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 100
    peripherals:
      - ledc_name: ledc_backlight

  - name: knob
    type: knob
    sub_type: gpio
    config:
      gpio_encoder_a: 10
      gpio_encoder_b: 6
      default_direction: 0
      enable_power_save: false
      use_rtc: false

  - name: knob_button
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      enable_power_save: false
      disable_pull: false
      long_press_time: 2000
      short_press_time: 100
    peripherals:
      - gpio_name: gpio_encoder_press

  - name: audio_dac
    chip: internal
    type: audio_codec
    config:
      adc_enabled: false
      dac_enabled: true
      sys_cfg:
        no_mclk: true
    peripherals:
      - i2s_name: i2s_audio_out

  - name: led_strip
    chip: ws2812
    type: led_strip
    sub_type: rmt
    version: default
    config:
      strip_gpio_num: 8
      max_leds: 1
      led_model: LED_MODEL_WS2812
      color_component_format: LED_STRIP_COLOR_COMPONENT_FMT_GRB
      invert_out: false
      rmt:
        clk_src: RMT_CLK_SRC_DEFAULT
        resolution_hz: 10000000
        mem_block_symbols: 0
        with_dma: false

  - name: fs_spiffs
    type: fs_spiffs
    version: default
    config:
      partition_label: NULL
      format_if_mount_failed: false
