# Peripherals Configuration for ESP32-C3-AWS-ExpressLink-DevKit
#
# Source: ESP32-C3-AWS-ExpressLink-DevKit SCHEMATIC V1D0 (2021-10-12)
# Reference: https://dl.espressif.com/dl/schematics/SCH_ESP32-C3-AWS-ExpressLink-DevKit_V1D0_20211012.pdf
# Reference: https://github.com/espressif/esp-aws-expresslink-eval  (pin table)
# Reference: https://www.espressif.com/sites/default/files/user-guide-aws-expresslink-devkit-en.pdf
# Reference: AWS IoT ExpressLink Programmer's Guide (pin semantics)
#            https://docs.aws.amazon.com/iot-expresslink/latest/programmersguide/elpg-hardware.html
#
# NOTE the esp-dev-kits HTML page for this board has been withdrawn (404); the
# user guide survives only as the standalone PDF above.
#
# Module: ESP32-C3-MINI-1-N4-A, 4 MB in-package flash, no PSRAM.
# Arduino-shield form factor: the board talks to a host MCU over the
# ExpressLink serial contract, which is a UART plus two handshake lines.
#
# This pin table is published verbatim in the eval repo's README, section 3
# "Hardware Description", and corroborated by the schematic's module symbol
# and its HOST_EVENT / HOST_WAKE / HOST_RESET nets to header J13:
#
#   ExpressLink pin | ESP32-C3 GPIO | module pin
#   TX              | GPIO19        | 27   (module -> host)
#   RX              | GPIO18        | 26   (host -> module)
#   EVENT           | GPIO10        | 16   (module -> host, signals an event)
#   WAKE            | GPIO3         | 6    (host -> module)
#   RESET           | EN            | 8    (hardware reset, not a GPIO)
#
# Polarities come from the AWS IoT ExpressLink Programmer's Guide, which is
# the normative contract this firmware implements:
#   EVENT  §8.1.1.2 "The EVENT pin is asserted (HIGH) when the event queue
#          contains one or more events. The EVENT pin is automatically
#          de-asserted as soon as the host processor has emptied the event
#          queue."  §2.2.7 adds that a host interrupts on the RISING edge.
#   WAKE   §2.2.6 "When not asserted (high), the ExpressLink module is allowed
#          to enter a low power sleep mode. If in low power sleep mode and
#          asserted (low), this will awake the ExpressLink module."
#          i.e. ACTIVE LOW, idle HIGH — see the gpio_wake correction below.
#   RESET  §2.2.5 "When asserted (low), the ExpressLink module is held in
#          reset" — active-low, which matches EN on the ESP32-C3.
#
# ----------------------------------------------------------------------
# CORRECTION: an earlier note here said no schematic is published for this
# board and the RGB LED pins were therefore unknown. A schematic IS published
# (URL at the top of this file) and it gives them. They are modeled below.
#
# Not modeled:
# - RST button (chip reset via EN, hardware path — not a GPIO)
# - The board ships pre-programmed with AWS IoT ExpressLink firmware; the
#   pin contract above is what that firmware exposes to the host
# ----------------------------------------------------------------------
peripherals:
  # ExpressLink host UART (module TX GPIO19 / RX GPIO18)
  - name: uart_1
    type: uart
    role: master
    config:
      uart_num: 1
      tx_io_num: 19
      rx_io_num: 18
      uart_config:
        baud_rate: 115200   # ExpressLink default host baud rate

  # EVENT line (GPIO10, module -> host)
  - name: gpio_event
    type: gpio
    role: io
    config:
      pin: 10
      mode: GPIO_MODE_OUTPUT
      default_level: 0

  # WAKE line (GPIO3, host -> module)
  # CORRECTED. This used to pull DOWN, described as "active-high wake, idle
  # low". WAKE is ACTIVE LOW: Programmer's Guide §2.2.6, "When not asserted
  # (high), the ExpressLink module is allowed to enter a low power sleep mode.
  # If in low power sleep mode and asserted (low), this will awake the
  # ExpressLink module." §4.7 (SLEEP) says the same from the host's side: "a
  # wakeup event is generated by the host lowering the WAKE pin." A pull-DOWN
  # therefore parked the line in the asserted state — the module could never
  # be allowed to sleep. Idle is HIGH, so pull up.
  # (The spec publishes no electrical table — no V_IH/V_IL, no statement about
  # an internal pull — so the pull here is ours, chosen to match the documented
  # idle level for a host that tri-states at reset.)
  - name: gpio_wake
    type: gpio
    version: default
    role: io
    config:
      pin: 3
      mode: GPIO_MODE_INPUT
      pull_up: true
      pull_down: false

  # ---------- RGB LED (EAST1616RGBA3), three discrete GPIOs ----------
  # Schematic V1D0, "Buttons & LEDs" block. Each colour has its own series
  # resistor, sized per-colour, which is what makes this three plain GPIOs
  # rather than one data line:
  #   R (LED pin 4) <- R51 240R(5%)  <- IO2
  #   G (LED pin 2) <- R52 40.2R(5%) <- IO8
  #   B (LED pin 1) <- R53 59R(5%)   <- IO9
  # LED pin 3 is the COMMON pin and sits on VDD33 (decoupled to GND by C9,
  # 1uF/16V) — a common ANODE. So the GPIOs SINK current and the LED is
  # ACTIVE LOW. Corroborated by R54/R55/R56, three 10 k pull-ups from VDD33
  # onto IO2/IO8/IO9: with a common anode those park all three colours OFF at
  # reset, whereas on a common cathode they would weakly light them.
  #
  # WARNING, two of these are ESP32-C3 strapping pins: GPIO9 selects boot mode
  # and GPIO8 is sampled at reset too. Both must be HIGH across reset — which
  # the 10 k pull-ups and the active-low wiring already arrange, but a driver
  # that parks them low will stop the board booting.
  #
  # NB the user guide's key-components table calls this "Addressable RGB LED
  # (EAST1616RGBA3), driven by three GPIOs" — "Addressable" is wrong, copied
  # from the DevKitM-1 docs. It is not a WS2812-family one-wire part and must
  # not be modeled as led_strip.
  - name: gpio_led_red
    type: gpio
    role: io
    config:
      pin: 2
      mode: GPIO_MODE_OUTPUT
      default_level: 1

  - name: gpio_led_green
    type: gpio
    role: io
    config:
      pin: 8
      mode: GPIO_MODE_OUTPUT
      default_level: 1

  - name: gpio_led_blue
    type: gpio
    role: io
    config:
      pin: 9
      mode: GPIO_MODE_OUTPUT
      default_level: 1
