# Devices Configuration for ESP32-S3-USB-OTG
#
# Source: ESP32-S3-USB-OTG user guide (esp-dev-kits) and the board's official
#         BSP pin map (espressif/esp-bsp, bsp/esp32_s3_usb_otg)
# Reference: https://docs.espressif.com/projects/esp-dev-kits/en/latest/esp32s3/esp32-s3-usb-otg/user_guide.html
# Reference: https://github.com/espressif/esp-bsp/tree/master/bsp/esp32_s3_usb_otg
#
devices:
  # ---------- 1.3-inch 240x240 ST7789 panel (SPI) ----------
  # CS = GPIO5 (the user guide calls this net LCD_EN), DC = GPIO4,
  # RST = GPIO8 active-low.
  - name: display_lcd
    chip: st7789
    type: display_lcd
    sub_type: spi
    version: default
    config:
      x_max: 240
      y_max: 240
      swap_xy: false
      mirror_x: false
      mirror_y: false
      invert_color: true
      need_reset: true
      io_spi_config:
        cs_gpio_num: 5
        dc_gpio_num: 4
        spi_mode: 0
        pclk_hz: 40000000
      lcd_panel_config:
        reset_gpio_num: 8
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
        data_endian: LCD_RGB_DATA_ENDIAN_BIG
        bits_per_pixel: 16
        flags:
          reset_active_high: false
        vendor_config: NULL
    peripherals:
      - spi_name: spi_display

  # ---------- LCD backlight (GPIO9) ----------
  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 100
    peripherals:
      - ledc_name: ledc_backlight

  # ---------- microSD card slot (SDMMC, 4-bit) ----------
  - name: fs_sdcard
    type: fs_fat
    sub_type: sdmmc
    version: default
    config:
      mount_point: "/sdcard"
      vfs_config:
        format_if_mount_failed: false
        max_files: 5
        allocation_unit_size: 16384
      sub_config:
        bus_width: 4
        pins:
          clk: 36
          cmd: 35
          d0: 37
          d1: 38
          d2: 33
          d3: 34

  # ---------- USB power gating ----------
  # 5 V out of the USB_DEV (Type-A male) interface
  - name: usb_dev_vbus_power
    type: power_ctrl
    sub_type: gpio
    version: default
    peripherals:
      - gpio_name: gpio_dev_vbus_en
        active_level: 1

  # Battery boost that powers a device attached to the USB host port
  - name: usb_host_boost_power
    type: power_ctrl
    sub_type: gpio
    version: default
    peripherals:
      - gpio_name: gpio_boost_en
        active_level: 1

  # Current limiter on the USB host port
  - name: usb_current_limit
    type: power_ctrl
    sub_type: gpio
    version: default
    peripherals:
      - gpio_name: gpio_limit_en
        active_level: 1

  # ---------- USB host / device path select ----------
  # Level 1 selects HOST, level 0 selects DEVICE (the power-on default).
  - name: usb_mode_select
    type: gpio_ctrl
    version: default
    config:
      active_level: 1
      default_level: 0
    peripherals:
      - gpio_name: gpio_usb_mode_sel

  # ---------- Status LEDs ----------
  - name: led_green
    type: gpio_ctrl
    version: default
    config:
      active_level: 1
      default_level: 0
    peripherals:
      - gpio_name: gpio_led_green

  - name: led_yellow
    type: gpio_ctrl
    version: default
    config:
      active_level: 1
      default_level: 0
    peripherals:
      - gpio_name: gpio_led_yellow

  # ---------- Front keys (all active-low) ----------
  # button_ok is also the Boot button (GPIO0 / Func).
  - name: button_ok
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      enable_power_save: false
      disable_pull: false
      long_press_time: 2000
      short_press_time: 100
    peripherals:
      - gpio_name: gpio_button_ok

  - name: button_up
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      enable_power_save: false
      disable_pull: false
      long_press_time: 2000
      short_press_time: 100
    peripherals:
      - gpio_name: gpio_button_up

  - name: button_dw
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      enable_power_save: false
      disable_pull: false
      long_press_time: 2000
      short_press_time: 100
    peripherals:
      - gpio_name: gpio_button_dw

  - name: button_menu
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      enable_power_save: false
      disable_pull: false
      long_press_time: 2000
      short_press_time: 100
    peripherals:
      - gpio_name: gpio_button_menu
