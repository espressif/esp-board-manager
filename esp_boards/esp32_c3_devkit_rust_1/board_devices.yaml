# Devices Configuration for ESP32-C3-DevKit-RUST-1
#
# Source: ESP32-C3-DevKit-RUST user guide (esp-dev-kits)
# Reference: https://docs.espressif.com/projects/esp-dev-kits/en/latest/esp32c3/esp32-c3-devkit-rust-2/user_guide.html
#
devices:
  # ---------- On-board WS2812 addressable RGB LED (GPIO2) ----------
  - name: led_strip
    chip: ws2812
    type: led_strip
    sub_type: rmt
    version: 1.0.0
    config:
      strip_gpio_num: 2
      max_leds: 1
      led_model: LED_MODEL_WS2812
      color_component_format: LED_STRIP_COLOR_COMPONENT_FMT_GRB
      invert_out: false
      rmt:
        clk_src: RMT_CLK_SRC_DEFAULT
        resolution_hz: 10000000
        mem_block_symbols: 0
        with_dma: false

  # ---------- User LED (GPIO7, active-high) ----------
  - name: user_led
    type: gpio_ctrl
    version: default
    config:
      # CONFIRMED active-high from the RUST-1 KiCad schematic, rev 1.2a
      # (2022-04-27): net IO7 -> R10 "470R 1%" -> D2 (Device:LED, rot 180, so
      # pin 2 "A"/anode faces the resistor) -> pin 1 "K"/cathode -> GND. The
      # sheet's LED block is captioned "Regular on GPIO7 / Addressable on
      # GPIO2". The README pin table does not state a level; only the
      # schematic does.
      # https://github.com/esp-rs/esp-rust-board/blob/master/hardware/esp-rust-board/schematic/esp-rust-board.pdf
      active_level: 1
      default_level: 0
    peripherals:
      - gpio_name: gpio_user_led

  # ---------- BOOT button (GPIO9, active-low, strapping) ----------
  - name: boot_button
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      enable_power_save: false
      disable_pull: false
      long_press_time: 2000
      short_press_time: 100
    peripherals:
      - gpio_name: gpio_boot_button
