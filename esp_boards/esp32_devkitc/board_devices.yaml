# Devices Configuration for ESP32-DevKitC V4
#
# Source: ESP32-DevKitC V4 user guide
# Reference: https://docs.espressif.com/projects/esp-dev-kits/en/latest/esp32/esp32-devkitc/user_guide.html
#
devices:
  # ---------- BOOT button (GPIO0, active-low, strapping) ----------
  - name: boot_button
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      enable_power_save: false
      disable_pull: false
      long_press_time: 2000
      short_press_time: 100
    peripherals:
      - gpio_name: gpio_boot_button
