# Peripherals Configuration for ESP32-PICO-KIT
#
# Source: ESP32-PICO-KIT user guide
# Reference: https://docs.espressif.com/projects/esp-dev-kits/en/latest/esp32/esp32-pico-kit/user_guide.html
#
# SiP: ESP32-PICO-D4, 4 MB in-package flash, no PSRAM. On-board hardware is
# minimal: BOOT and EN buttons, a CP2102N USB-to-UART bridge and a red power
# indicator LED.
#
# ----------------------------------------------------------------------
# Not modeled:
# - EN button (chip reset, hardware path — not a GPIO)
# - Red power-on LED: wired to the 3.3 V rail, NOT GPIO controlled
# - CP2102N USB-to-UART bridge on UART0 (console, handled by ROM/IDF)
# - Header pins FSD*/FCLK/FCS are wired to the in-package flash of the
#   ESP32-PICO-D4 and must not be used by an application
# ----------------------------------------------------------------------
peripherals:
  # BOOT button (GPIO0, active-low, strapping pin — input only at runtime)
  - name: gpio_boot_button
    type: gpio
    version: default
    role: io
    config:
      pin: 0
      mode: GPIO_MODE_INPUT
      pull_up: true
      pull_down: false
