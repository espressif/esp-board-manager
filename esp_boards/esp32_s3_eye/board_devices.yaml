devices:
  - name: audio_adc
    chip: internal
    type: audio_codec
    config:
      adc_enabled: true
      dac_enabled: false
    peripherals:
      - i2s_name: i2s_audio_in

  - name: fs_sdcard
    type: fs_fat
    sub_type: sdmmc
    version: default
    config:
      mount_point: "/sdcard"
      vfs_config:
        format_if_mount_failed: false
        max_files: 5
        allocation_unit_size: 16384
      sub_config:
        slot: SDMMC_HOST_SLOT_0
        frequency: SDMMC_FREQ_HIGHSPEED
        bus_width: 1
        slot_flags: 0
        pins:
          clk: 39
          cmd: 38
          d0: 40
          d1: -1
          d2: -1
          d3: -1
          cd: -1
          wp: -1

  - name: display_lcd
    chip: st7789
    type: display_lcd
    sub_type: spi
    version: default
    config:
      mirror_x: false
      mirror_y: false
      invert_color: true
      x_max: 240
      y_max: 240
      need_reset: false
      io_spi_config:
        cs_gpio_num: 44
        dc_gpio_num: 43
        spi_mode: 0
        pclk_hz: 80000000
        trans_queue_depth: 10
        lcd_cmd_bits: 8
        lcd_param_bits: 8
      lcd_panel_config:
        reset_gpio_num: -1
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
        data_endian: LCD_RGB_DATA_ENDIAN_BIG
        bits_per_pixel: 16
    peripherals:
      - spi_name: spi_display

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 100
    peripherals:
      - ledc_name: ledc_backlight

  - name: camera
    type: camera
    sub_type: dvp
    version: default
    config:
      dvp_config:
        reset_io: -1
        pwdn_io: -1
        vsync_io: 6
        data_width: CAM_CTLR_DATA_WIDTH_8
        de_io: 7
        pclk_io: 13
        xclk_io: 15
        xclk_freq: 16000000
        data_io:
          data_io_0: 11
          data_io_1: 9
          data_io_2: 8
          data_io_3: 10
          data_io_4: 12
          data_io_5: 18
          data_io_6: 17
          data_io_7: 16
    peripherals:
      - i2c_name: i2c_master
        frequency: 400000

  - name: adc_button_group
    type: button
    sub_type: adc_multi
    version: default
    config:
      long_press_time: 2000
      short_press_time: 100
      events_cfg:
        press_down: true
        press_up: true
        single_click: true
        double_click: true
        multi_click: false
        long_press_start: true
        long_press_up: true
        long_press_hold: false
        press_repeat: false
        press_repeat_done: false
        press_end: false
      button_num: 4
      max_voltage: 3000
      voltage_range: [380, 820, 1980, 2410]
      button_labels: ["BUTTON_4", "BUTTON_3", "BUTTON_2", "BUTTON_1"]
    peripherals:
      - adc_name: adc_oneshot

  - name: boot_button
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      enable_power_save: false
      disable_pull: false
      long_press_time: 2000
      short_press_time: 100
    peripherals:
      - gpio_name: gpio_boot_button

  - name: status_led
    chip: gpio_led
    type: gpio_ctrl
    version: default
    config:
      active_level: 1
      default_level: 0
    peripherals:
      - gpio_name: gpio_led
