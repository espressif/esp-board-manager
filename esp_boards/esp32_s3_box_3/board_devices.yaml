# Devices Configuration
devices:
  # ---------- BOOT button (GPIO0, active-low) ----------
  - name: boot_button
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      enable_power_save: false
      disable_pull: false
      long_press_time: 2000
      short_press_time: 100
    peripherals:
      - gpio_name: gpio_boot_button

  # SD Card Power
  - name: sdcard_power
    type: power_ctrl
    sub_type: gpio
    peripherals:
    - gpio_name: gpio_sd_power
      active_level: 0

  - name: audio_dac
    chip: es8311
    type: audio_codec
    config:
      adc_enabled: false
      dac_enabled: true
      sys_cfg:
        no_mclk: false

    # Power amplifier configuration
    peripherals:
      - pa_name: gpio_pa_control
        gain: 6                    # dB
        active_level: 1         # 0-low, 1-high
      - i2s_name: i2s_audio_out
      - i2c_name: i2c_master
        address: 0x30
        frequency: 400000          # Hz

  - name: audio_adc
    chip: es7210
    type: audio_codec
    config:
      adc_enabled: true
      sys_cfg:
        no_mclk: true
      adc_cfg:
        # codec_dev 2.0 label order is LSB to MSB: MIC1, MIC2, MIC3, MIC4.
        label: [FL, FR, RE, NA]

    # Power amplifier configuration
    peripherals:
      # I2S interface configuration
      - i2s_name: i2s_audio_in
      # I2C interface configuration
      - i2c_name: i2c_master
        address: 0x80
        frequency: 400000          # Hz

  - name: fs_sdcard
    type: fs_fat
    sub_type: sdmmc
    power_ctrl_device: sdcard_power
    version: default
    config:
      sub_config:
        bus_width: 4
        pins:
          clk: 11
          cmd: 14
          d0: 9
          d1: 13
          d2: 42
          d3: 12

  - name: display_lcd
    chip: ili9341
    type: display_lcd
    sub_type: spi
    version: default
    dependencies:
      espressif/esp_lcd_ili9341: "*"
    config:
      mirror_x: true
      mirror_y: true
      x_max: 320
      y_max: 240
      # esp_lcd_panel_io_spi_config_t fields
      io_spi_config:
        cs_gpio_num: 5
        dc_gpio_num: 4
        spi_mode: 0
        pclk_hz: 20000000
        flags:
          sio_mode: true                 # Single line mode

      lcd_panel_config:
        reset_gpio_num: 48
        flags:
          reset_active_high: true
        # ST77916 specific configuration
        vendor_config: NULL

    peripherals:
    - spi_name: spi_display            # SPI peripheral for LCD communication

  # Touch Panel Configuration
  - name: lcd_touch
    chip: auto
    type: lcd_touch
    sub_type: i2c
    version: default
    dependencies:
      espressif/esp_lcd_touch_gt911: "*"
      espressif/esp_lcd_touch_tt21100: "*"
    config:
      # esp_lcd_panel_io_i2c_config_t fields for touch communication
      io_i2c_config:
        lcd_cmd_bits: 16                  # Bit-width of LCD command
      # esp_lcd_touch_config_t fields for touch configuration
      touch_config:
        x_max: 320                        # Maximum X coordinate (BSP_LCD_H_RES)
        y_max: 240                        # Maximum Y coordinate (BSP_LCD_V_RES)
        int_gpio_num: 3                   # Interrupt GPIO (BSP_LCD_TOUCH_INT)
    peripherals:
      - i2c_name: i2c_master              # I2C peripheral for touch communication
        i2c_addr: [0xBA, 0x28, 0x48]  # GT911/TT21100 8-bit I2C addresses, from 7-bit 0x5D/0x14/0x24

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    peripherals:
      - ledc_name: ledc_backlight               # LEDC peripheral for GPIO 47
