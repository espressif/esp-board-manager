# Devices Configuration for M5Stack ATOM Matrix
#
# Source: M5Stack ATOM Matrix documentation
# Reference: https://docs.m5stack.com/en/core/ATOM%20Matrix
#
devices:
  # ---------- 5x5 WS2812C-2020 addressable RGB matrix (25 LEDs) ----------
  # Wired as one chain on GPIO27; the 5x5 geometry is an application
  # concern, the driver only sees a 25-pixel strip.
  - name: led_strip
    chip: ws2812
    type: led_strip
    sub_type: rmt
    version: 1.0.0
    config:
      strip_gpio_num: 27
      max_leds: 25
      led_model: LED_MODEL_WS2812
      color_component_format: LED_STRIP_COLOR_COMPONENT_FMT_GRB
      invert_out: false
      rmt:
        clk_src: RMT_CLK_SRC_DEFAULT
        resolution_hz: 10000000
        mem_block_symbols: 0
        with_dma: false

  # ---------- Under-matrix button (GPIO39, active-low) ----------
  - name: user_button
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      enable_power_save: false
      disable_pull: true      # GPIO39 is input-only; no internal pull available
      long_press_time: 2000
      short_press_time: 100
    peripherals:
      - gpio_name: gpio_user_button

  # ---------- Infrared transmit LED (GPIO12) ----------
  - name: ir_tx
    type: gpio_ctrl
    version: default
    config:
      active_level: 1
      default_level: 0
    peripherals:
      - gpio_name: gpio_ir_tx
