# Devices Configuration for M5StickC PLUS2
#
# Source: M5StickC PLUS2 official documentation (pin map)
# Reference: https://docs.m5stack.com/en/core/M5StickC%20PLUS2
#
# The ST7789V2 panel is driven by the esp_lcd_panel_st7789 driver built into
# ESP-IDF's esp_lcd component, so no extra dependency is declared.
#
devices:
  # ---------- Power latch (GPIO4, active-high) ----------
  # Held HIGH the board stays on; released it powers itself down.
  - name: power_hold
    type: power_ctrl
    sub_type: gpio
    peripherals:
      - gpio_name: gpio_power_hold
        active_level: 1

  # ---------- 1.14" 135x240 IPS LCD (ST7789V2, SPI) ----------
  # The visible window is offset inside the controller's 240x320 GRAM
  # (column +52, row +40). bmgr's display model has no offset field; the
  # application applies it via the panel gap API.
  - name: display_lcd
    chip: st7789
    type: display_lcd
    sub_type: spi
    version: default
    config:
      swap_xy: false
      mirror_x: false
      mirror_y: false
      x_max: 135
      y_max: 240
      invert_color: true              # ST7789V2 panel on M5Stack needs inversion
      need_reset: true
      io_spi_config:
        cs_gpio_num: 5
        dc_gpio_num: 14
        spi_mode: 0
        pclk_hz: 40000000
        trans_queue_depth: 10
        lcd_cmd_bits: 8
        lcd_param_bits: 8
      lcd_panel_config:
        reset_gpio_num: 12
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
        bits_per_pixel: 16
        flags:
          reset_active_high: false
        vendor_config: NULL
    peripherals:
      - spi_name: spi_display

  # ---------- LCD backlight (GPIO27 via LEDC) ----------
  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 100
    peripherals:
      - ledc_name: ledc_backlight

  # ---------- Red status LED, shared with the IR emitter (GPIO19) ----------
  - name: status_led
    type: gpio_ctrl
    version: default
    config:
      active_level: 1
      default_level: 0
    peripherals:
      - gpio_name: gpio_status_led

  # ---------- Button A (front, active-low) ----------
  - name: button_a
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      enable_power_save: false
      disable_pull: true        # GPIO37 is input-only; no internal pull available
      long_press_time: 2000
      short_press_time: 100
    peripherals:
      - gpio_name: gpio_button_a

  # ---------- Button B (side, active-low) ----------
  - name: button_b
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      enable_power_save: false
      disable_pull: true        # GPIO39 is input-only; no internal pull available
      long_press_time: 2000
      short_press_time: 100
    peripherals:
      - gpio_name: gpio_button_b

  # ---------- Power / wake button (GPIO35, active-low) ----------
  - name: button_pwr
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      enable_power_save: false
      disable_pull: true        # GPIO35 is input-only; no internal pull available
      long_press_time: 2000
      short_press_time: 100
    peripherals:
      - gpio_name: gpio_button_pwr
