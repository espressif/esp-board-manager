# Peripherals Configuration for M5StickC PLUS2
#
# Source: M5StickC PLUS2 official documentation (pin map)
# Reference: https://docs.m5stack.com/en/core/M5StickC%20PLUS2
#
# Module: ESP32-PICO-V3-02 (in-package 8 MB flash + 2 MB quad PSRAM).
#
# Unlike the M5StickC and M5StickC PLUS, this board has NO AXP192: power is
# held up by a discrete latch on GPIO4, which the firmware must drive HIGH
# early or the board turns itself off when the power button is released.
# The LCD backlight is therefore a real GPIO (GPIO27) rather than a PMU rail.
#
# One internal I2C bus on GPIO21 (SDA) / GPIO22 (SCL) carries the MPU6886
# IMU (7-bit 0x68) and the BM8563 RTC (7-bit 0x51).
#
peripherals:
  # Internal I2C bus: MPU6886 IMU + BM8563 RTC
  - name: i2c_master
    type: i2c
    role: master
    config:
      port: 0
      pins:
        sda: 21
        scl: 22

  # ST7789V2 LCD bus. Write-only panel, so no MISO line is wired.
  - name: spi_display
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI2_HOST     # HSPI; routed through the GPIO matrix
        sclk_io_num: 13
        mosi_io_num: 15
        miso_io_num: -1
        max_transfer_sz: 6480   # 135 * 24 lines * 2 bytes

  # LCD backlight (GPIO27, PWM dimmable)
  - name: ledc_backlight
    type: ledc
    config:
      gpio_num: 27
      channel: LEDC_CHANNEL_0
      timer_sel: LEDC_TIMER_0
      freq_hz: 5000
      duty_resolution: LEDC_TIMER_10_BIT
      speed_mode: LEDC_LOW_SPEED_MODE

  # SPM1423 PDM microphone
  - name: i2s_audio_in
    type: i2s
    role: master
    format: pdm-in
    config:
      port: 0
      sample_rate_hz: 16000
      data_bit_width: 16
      slot_bit_width: I2S_SLOT_BIT_WIDTH_AUTO
      slot_mode: I2S_SLOT_MODE_MONO
      slot_mask: I2S_PDM_SLOT_RIGHT
      pins:
        clk: 0                  # GPIO0 is a strapping pin; driven only after boot
        din: 34

  # Passive buzzer (GPIO2). A passive buzzer is driven by a PWM tone, so the
  # LEDC channel is the peripheral; there is no bmgr buzzer device type, and
  # ledc_ctrl models a duty percentage rather than a frequency.
  - name: ledc_buzzer
    type: ledc
    config:
      gpio_num: 2
      channel: LEDC_CHANNEL_1
      timer_sel: LEDC_TIMER_1
      freq_hz: 4000
      duty: 0
      duty_resolution: LEDC_TIMER_10_BIT
      speed_mode: LEDC_LOW_SPEED_MODE

  # Power latch (GPIO4). Must be driven HIGH to keep the board powered once
  # the power button is released; dropping it LOW switches the board off.
  - name: gpio_power_hold
    type: gpio
    role: io
    config:
      pin: 4
      mode: GPIO_MODE_OUTPUT
      default_level: 1

  # Red status LED, shared with the infrared transmit LED (GPIO19).
  # One pin drives both emitters, so an IR burst also blinks the red LED.
  - name: gpio_status_led
    type: gpio
    role: io
    config:
      pin: 19
      mode: GPIO_MODE_OUTPUT
      default_level: 0

  # Button A (front, active-low). GPIO37 is input-only on the ESP32 and has
  # NO internal pull resistor; the board provides the external pull-up.
  - name: gpio_button_a
    type: gpio
    version: default
    role: io
    config:
      pin: 37
      mode: GPIO_MODE_INPUT
      pull_up: false
      pull_down: false

  # Button B (side, active-low). GPIO39 is input-only, external pull-up.
  - name: gpio_button_b
    type: gpio
    version: default
    role: io
    config:
      pin: 39
      mode: GPIO_MODE_INPUT
      pull_up: false
      pull_down: false

  # Power / wake button (GPIO35, active-low). GPIO35 is input-only.
  # Also the hardware wake source; a long press cuts power regardless of
  # what the firmware does with gpio_power_hold.
  - name: gpio_button_pwr
    type: gpio
    version: default
    role: io
    config:
      pin: 35
      mode: GPIO_MODE_INPUT
      pull_up: false
      pull_down: false

  # ----------------------------------------------------------------------
  # Not modeled:
  # - MPU6886 6-axis IMU (I2C 7-bit 0x68) and BM8563 RTC (I2C 7-bit 0x51):
  #   no bmgr device types; the shared i2c_master above is their bus
  # - SPM1423 PDM MEMS microphone: control-less, the pdm-in peripheral
  #   above IS the interface
  # - Battery voltage divider on GPIO38 (ADC1_CH2): a raw ADC reading, no
  #   fuel gauge and no bmgr device type
  # - Grove HY2.0-4P port (GPIO32 / GPIO33 plus 5V and GND)
  # - Header pads GPIO0 / GPIO25 / GPIO26 / GPIO36
  # - RESET button (EN pin, handled in hardware)
  # - CH9102 USB-to-UART bridge on the USB Type-C port (console path)
  # - The IR LED is a plain GPIO; carrier modulation is an application
  #   concern (RMT), there is no bmgr device type for it
  # ----------------------------------------------------------------------
