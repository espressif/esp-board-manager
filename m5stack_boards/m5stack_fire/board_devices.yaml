# Devices Configuration for M5Stack Fire v2.7
#
# Source: M5Stack Fire v2.7 official documentation (pin map)
# Reference: https://docs.m5stack.com/en/core/fire_v2.7
#
# The panel is an ILI9342C, which is command-compatible with the ILI9341 and
# is driven by espressif/esp_lcd_ili9341 (same choice as the upstream
# m5stack_cores3 board and the Core Basic, whose panels are also ILI9342C).
#
devices:
  # ---------- 2.0" 320x240 IPS LCD (ILI9342C, SPI) ----------
  - name: display_lcd
    chip: ili9341                     # ILI9342C: ILI9341-compatible command set
    type: display_lcd
    sub_type: spi
    version: default
    dependencies:
      espressif/esp_lcd_ili9341: "*"
    config:
      swap_xy: false
      mirror_x: false
      mirror_y: false
      x_max: 320
      y_max: 240
      invert_color: true              # ILI9342C panel on M5Stack needs inversion
      need_reset: true
      io_spi_config:
        cs_gpio_num: 14
        dc_gpio_num: 27
        spi_mode: 0
        pclk_hz: 40000000
        trans_queue_depth: 10
        lcd_cmd_bits: 8
        lcd_param_bits: 8
      lcd_panel_config:
        reset_gpio_num: 33
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_BGR
        bits_per_pixel: 16
        flags:
          reset_active_high: false
        vendor_config: ""
    peripherals:
      - spi_name: spi_master

  # ---------- LCD backlight (GPIO32 via LEDC) ----------
  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 100
    peripherals:
      - ledc_name: ledc_backlight

  # ---------- microSD card (shares the LCD SPI bus, CS GPIO4) ----------
  - name: fs_sdcard
    type: fs_fat
    sub_type: spi
    version: default
    config:
      mount_point: "/sdcard"
      vfs_config:
        format_if_mount_failed: false
        max_files: 5
        allocation_unit_size: 16384
      sub_config:
        cs_gpio_num: 4
    peripherals:
      - spi_name: spi_master

  # ---------- Side RGB bars: 2 x 5 SK6812 (one 10-pixel chain, GPIO15) ----
  # The two five-LED bars are a single daisy chain; the left/right split is
  # an application concern, the driver only sees a 10-pixel strip.
  - name: led_strip
    chip: sk6812
    type: led_strip
    sub_type: rmt
    version: 1.0.0
    config:
      strip_gpio_num: 15
      max_leds: 10
      led_model: LED_MODEL_SK6812
      color_component_format: LED_STRIP_COLOR_COMPONENT_FMT_GRB
      invert_out: false
      rmt:
        clk_src: RMT_CLK_SRC_DEFAULT
        resolution_hz: 10000000
        mem_block_symbols: 0
        with_dma: false

  # ---------- Front buttons A / B / C (active-low) ----------
  - name: button_a
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      enable_power_save: false
      disable_pull: true              # GPIO39 has no internal pull; board pulls up
      long_press_time: 2000
      short_press_time: 100
    peripherals:
      - gpio_name: gpio_button_a

  - name: button_b
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      enable_power_save: false
      disable_pull: true              # GPIO38 has no internal pull; board pulls up
      long_press_time: 2000
      short_press_time: 100
    peripherals:
      - gpio_name: gpio_button_b

  - name: button_c
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      enable_power_save: false
      disable_pull: true              # GPIO37 has no internal pull; board pulls up
      long_press_time: 2000
      short_press_time: 100
    peripherals:
      - gpio_name: gpio_button_c
