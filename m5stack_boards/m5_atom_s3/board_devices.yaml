devices:
  - name: display_lcd
    chip: gc9a01
    type: display_lcd
    sub_type: spi
    version: default
    dependencies:
      espressif/esp_lcd_gc9a01: "*"
    config:
      mirror_x: true
      mirror_y: true
      invert_color: true
      x_max: 128
      y_max: 128
      io_spi_config:
        cs_gpio_num: 15
        dc_gpio_num: 33
        pclk_hz: 40000000
        spi_mode: 0
      lcd_panel_config:
        reset_gpio_num: 34
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_BGR
        bits_per_pixel: 16
    peripherals:
      - spi_name: spi_display

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 100
    peripherals:
      - ledc_name: ledc_backlight

  - name: boot_button
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      enable_power_save: false
      disable_pull: false
      long_press_time: 2000
      short_press_time: 100
    peripherals:
      - gpio_name: gpio_button

  - name: fs_spiffs
    type: fs_spiffs
    version: default
    config:
      partition_label: NULL
      format_if_mount_failed: false
