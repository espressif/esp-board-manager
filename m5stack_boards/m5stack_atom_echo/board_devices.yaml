# Devices Configuration for M5Stack ATOM Echo
#
# Source: M5Stack ATOM Echo documentation
# Reference: https://docs.m5stack.com/en/atom/atomecho
#
devices:
  # ---------- On-board SK6812 3535 addressable RGB LED ----------
  - name: led_strip
    chip: sk6812
    type: led_strip
    sub_type: rmt
    version: 1.0.0
    config:
      strip_gpio_num: 27
      max_leds: 1
      led_model: LED_MODEL_SK6812
      color_component_format: LED_STRIP_COLOR_COMPONENT_FMT_GRB
      invert_out: false
      rmt:
        clk_src: RMT_CLK_SRC_DEFAULT
        resolution_hz: 10000000
        mem_block_symbols: 0
        with_dma: false

  # ---------- Front button (GPIO39, active-low) ----------
  - name: user_button
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      enable_power_save: false
      disable_pull: true      # GPIO39 is input-only; no internal pull available
      long_press_time: 2000
      short_press_time: 100
    peripherals:
      - gpio_name: gpio_user_button

  # ---------- NS4168 I2S class-D amplifier ----------
  - name: audio_dac
    chip: internal
    type: audio_codec
    config:
      adc_enabled: false
      dac_enabled: true
      sys_cfg:
        no_mclk: true
    peripherals:
      - i2s_name: i2s_audio_out

  # ---------- SPM1423 PDM microphone ----------
  # init_skip: initialize by name once audio_dac has been released.
  - name: audio_adc
    chip: internal
    type: audio_codec
    init_skip: true
    config:
      adc_enabled: true
      dac_enabled: false
    peripherals:
      - i2s_name: i2s_audio_in
