# Devices Configuration for M5Stack AtomS3-Lite
#
# Source: M5Stack AtomS3-Lite documentation
# Reference: https://docs.m5stack.com/en/core/AtomS3%20Lite
#
devices:
  # ---------- On-board WS2812C-2020 addressable RGB LED ----------
  - name: led_strip
    chip: ws2812
    type: led_strip
    sub_type: rmt
    version: 1.0.0
    config:
      strip_gpio_num: 35     # Sch_M5_AtomS3_v1.0.pdf, "RGB & IR" block: U3 (WS2812)
                             # DI on net SK_DIN, landing on U1 pin 40 = GPIO35.
                             # Matches M5Unified.cpp _pin_table_other0 (RGBLED
                             # column): { board_M5AtomS3Lite, GPIO_NUM_35 }
      max_leds: 1
      led_model: LED_MODEL_WS2812
      color_component_format: LED_STRIP_COLOR_COMPONENT_FMT_GRB
      invert_out: false
      rmt:
        clk_src: RMT_CLK_SRC_DEFAULT
        resolution_hz: 10000000
        mem_block_symbols: 0
        with_dma: false

  # ---------- Front button, full face (active-low) ----------
  - name: user_button
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      enable_power_save: false
      disable_pull: false
      long_press_time: 2000
      short_press_time: 100
    peripherals:
      - gpio_name: gpio_user_button

  # ---------- Infrared transmit LED ----------
  - name: ir_tx
    type: gpio_ctrl
    version: default
    config:
      active_level: 1
      default_level: 0
    peripherals:
      - gpio_name: gpio_ir_tx
