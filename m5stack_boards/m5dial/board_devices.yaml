devices:
  - name: display_lcd
    chip: gc9a01
    type: display_lcd
    sub_type: spi
    version: default
    dependencies:
      espressif/esp_lcd_gc9a01: "*"
    config:
      mirror_x: false
      mirror_y: false
      invert_color: true
      x_max: 240
      y_max: 240
      io_spi_config:
        cs_gpio_num: 7
        dc_gpio_num: 4
        pclk_hz: 40000000
        spi_mode: 0
      lcd_panel_config:
        reset_gpio_num: 8
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_BGR
        bits_per_pixel: 16
    peripherals:
      - spi_name: spi_display

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 100
    peripherals:
      - ledc_name: ledc_backlight

  - name: lcd_touch
    chip: ft5x06
    type: lcd_touch
    sub_type: i2c
    version: default
    dependencies:
      espressif/esp_lcd_touch_ft5x06: "^1"
    config:
      io_i2c_config:
        lcd_cmd_bits: 8
        scl_speed_hz: 400000
      touch_config:
        x_max: 240
        y_max: 240
        rst_gpio_num: -1
        int_gpio_num: 14
    peripherals:
      - i2c_name: i2c_master
        i2c_addr: [0x70]

  - name: knob
    type: knob
    sub_type: gpio
    config:
      gpio_encoder_a: 41
      gpio_encoder_b: 40
      default_direction: 0
      enable_power_save: false
      use_rtc: false

  - name: knob_button
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      enable_power_save: false
      disable_pull: false
      long_press_time: 2000
      short_press_time: 100
    peripherals:
      - gpio_name: gpio_button

  - name: fs_spiffs
    type: fs_spiffs
    version: default
    config:
      partition_label: NULL
      format_if_mount_failed: false
