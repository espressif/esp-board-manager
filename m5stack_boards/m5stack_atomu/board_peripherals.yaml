# Peripherals Configuration for M5Stack ATOM U
#
# Source: M5Stack ATOM U documentation
# Reference: https://docs.m5stack.com/en/core/ATOM%20U
#
# Module: ESP32-PICO-D4 (in-package 4 MB flash, no PSRAM).
# The board plugs straight into a USB-A socket; on-board hardware is an
# SPM1423 PDM microphone (GPIO5 clock / GPIO19 data), an SK6812 RGB LED on
# GPIO27 (owned by the led_strip device, so not declared here), the side
# button on GPIO39 and an IR transmit LED on GPIO12.
#
peripherals:
  # SPM1423 PDM microphone (capture only).
  - name: i2s_audio_in
    type: i2s
    role: master
    format: pdm-in
    config:
      port: 0
      sample_rate_hz: 16000
      data_bit_width: 16
      slot_bit_width: I2S_SLOT_BIT_WIDTH_AUTO
      slot_mode: I2S_SLOT_MODE_MONO
      slot_mask: I2S_PDM_SLOT_RIGHT
      pins:
        clk: 5
        din: 19

  # Side button (GPIO39, active-low).
  # GPIO39 is input-only on ESP32 and has NO internal pull resistor;
  # the board provides the external pull-up.
  - name: gpio_user_button
    type: gpio
    version: default
    role: io
    config:
      pin: 39
      mode: GPIO_MODE_INPUT
      pull_up: false
      pull_down: false

  # Infrared transmit LED (GPIO12, active-high)
  - name: gpio_ir_tx
    type: gpio
    role: io
    config:
      pin: 12
      mode: GPIO_MODE_OUTPUT
      default_level: 0

  # ----------------------------------------------------------------------
  # Not modeled:
  # - SPM1423 PDM MEMS microphone: control-less (no register interface),
  #   so there is no audio_codec device for it — the pdm-in peripheral
  #   above IS the interface
  # - Grove HY2.0-4P port (GPIO26 / GPIO32 plus 5V and GND): a user-wired
  #   expansion port, not an on-board device
  # - RESET button (EN pin, handled in hardware)
  # - USB-A plug: USB-to-UART bridge (console path), not an SoC peripheral
  # - The IR LED above is a plain GPIO; carrier modulation is an
  #   application concern (RMT), there is no bmgr device type for it
  # ----------------------------------------------------------------------
