# Devices Configuration for M5NanoC6
#
# Source: M5NanoC6 documentation
# Reference: https://docs.m5stack.com/en/core/M5NanoC6
#
devices:
  # ---------- WS2812 RGB LED supply switch (GPIO19) ----------
  - name: led_power
    type: power_ctrl
    sub_type: gpio
    peripherals:
      - gpio_name: gpio_power_led
        active_level: 1

  # ---------- On-board WS2812 addressable RGB LED ----------
  - name: led_strip
    chip: ws2812
    type: led_strip
    sub_type: rmt
    version: 1.0.0
    power_ctrl_device: led_power
    config:
      strip_gpio_num: 20
      max_leds: 1
      led_model: LED_MODEL_WS2812
      color_component_format: LED_STRIP_COLOR_COMPONENT_FMT_GRB
      invert_out: false
      rmt:
        clk_src: RMT_CLK_SRC_DEFAULT
        resolution_hz: 10000000
        mem_block_symbols: 0
        with_dma: false

  # ---------- Blue indicator LED (GPIO7) ----------
  - name: blue_led
    type: gpio_ctrl
    version: default
    config:
      active_level: 1
      default_level: 0
    peripherals:
      - gpio_name: gpio_blue_led

  # ---------- Infrared transmit LED (GPIO3) ----------
  - name: ir_tx
    type: gpio_ctrl
    version: default
    config:
      active_level: 1
      default_level: 0
    peripherals:
      - gpio_name: gpio_ir_tx

  # ---------- User button (GPIO9, active-low) ----------
  - name: user_button
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      enable_power_save: false
      disable_pull: false
      long_press_time: 2000
      short_press_time: 100
    peripherals:
      - gpio_name: gpio_user_button
